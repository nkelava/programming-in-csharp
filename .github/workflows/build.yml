name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build all solutions
        shell: bash
        run: |
          for solution in $(git ls-files '*.sln'); do
            dotnet build "$solution" --configuration Release
          done

      - name: Run console applications
        shell: bash
        run: |
          # Runs a console application with the given input and checks that its output contains the expected text
          check() {
            output=$(printf "$2" | dotnet run --project "$1" --configuration Release --no-build 2>&1 || true)
            if ! grep -qF -- "$3" <<< "$output"; then
              echo "::error::$1 did not print: $3"
              echo "$output"
              exit 1
            fi
            echo "$1: OK"
          }

          check class-01/NumberFormatting '10\n4\n' '10 / 4 = 2.5'
          check class-01/OverflowChecking '' 'No overflow.'

          # Console.Clear fails on Windows when the output is redirected, as it is here
          if [ "$RUNNER_OS" != "Windows" ]; then
            check class-01/BankAccounts '2\n\n3\n' 'There are no bank accounts to display.'
            check class-02/Shapes '2\n4\nn\n4\n\nq\n' 'The total area of all inserted elements is: 16'
            check class-03/ShapeEvents '1\n2\nn\nq\n' 'EVENT RAISED:  x-1, y-1'
          fi
